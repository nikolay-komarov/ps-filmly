<div class="input-wrapper">
  @if (iconUrl()) {
    <img class="input-wrapper__icon" [src]="iconUrl()" alt="" aria-hidden="true" />
  }
  <input
    class="input-wrapper__input input-wrapper__input--with-icon"
    [class.input-wrapper__input--with-toggle]="true"
    [type]="passwordVisible() ? 'text' : 'password'"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="handleInput($event)"
  />
  <button
    type="button"
    class="input-wrapper__toggle"
    [attr.aria-label]="passwordVisible() ? 'Скрыть пароль' : 'Показать пароль'"
    [disabled]="disabled()"
    (click)="togglePasswordVisibility()"
  >
    <img [src]="visibilityIconUrl" alt="" aria-hidden="true" />
  </button>
</div>
