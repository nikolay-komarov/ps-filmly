<form class="login-form">
  <div class="login-form__logo">
    <img class="login-form__logo-icon" src="images/logo.svg" alt="Логотип Filmly" />
    <span class="login-form__logo-text">Filmly</span>
  </div>

  <h1 class="login-form__title">Вход</h1>

  <div class="login-form__fields">
    <app-input
      type="email"
      placeholder="Email"
      iconUrl="icons/user.svg"
      [(value)]="email"
    />

    <app-password-input
      placeholder="Пароль"
      iconUrl="icons/lock.svg"
      [(value)]="password"
    />
  </div>

  <app-button class="login-form__submit" (clicked)="handleSubmit()">Войти</app-button>
</form>
